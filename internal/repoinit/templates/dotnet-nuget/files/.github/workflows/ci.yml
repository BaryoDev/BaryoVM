name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# This workflow runs on pull requests, including from forks, and writes nothing back.
permissions:
  contents: read

jobs:
  build:
    # The required status check in branch protection is this name. Renaming it here without
    # changing the protection leaves every pull request waiting on a check that never reports.
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Edit to the SDKs the repository builds with.
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --configuration Release --no-restore

      - run: dotnet test --configuration Release --no-build --verbosity normal
