version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # error strings end with "..." in usage hints; changing them changes CLI output
        - -ST1005
  exclusions:
    presets:
      - std-error-handling
