name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  # A tag from a red commit must not publish. CI runs on main and pull requests, not on tags, so the
  # same checks run here and the release job waits for them.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history + tags for the changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the formula into arnelirobles/homebrew-tap, which GITHUB_TOKEN cannot reach
          # because it is scoped to this repository. Deliberately defaulted to empty rather than
          # left unset: .goreleaser.yaml reads it in a template, and an unset variable would fail
          # the template instead of skipping the step.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  close-milestone:
    name: Close the release milestone
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Close the milestone and move what is left
        run: |
          VERSION="${VERSION#v}"
          set -euo pipefail
          # barakocms.com/roadmap shows the first open milestone per repository and never looks at
          # releases, so a milestone left open after its release keeps the page on an old version.
          # Checked before anything else, because the value is matched against milestone titles.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::'$VERSION' is not a version"; exit 1; }
          # Prereleases leave their milestone open: the final release closes it.
          case "$VERSION" in *-*) echo "::notice::$VERSION is a prerelease; milestone left open."; exit 0 ;; esac
          # One "number title" line per milestone.
          milestones() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=$1&per_page=100" \
              --jq '.[] | "\(.number) \(.title)"'
          }
          number_of() { awk -v t="$1" '{ n = $1; sub(/^[0-9]+ /, "") } $0 == t { print n; exit }'; }
          open_list=$(milestones open)
          ms=$(number_of "$VERSION" <<< "$open_list")
          if [ -z "$ms" ]; then
            echo "::notice::No open milestone named $VERSION."
            exit 0
          fi
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?milestone=$ms&state=open&per_page=100" --jq '.[].number')
          if [ -n "$open" ]; then
            # Unfinished items roll forward to the lowest open milestone above this version, or to
            # the next minor when there is none, so nothing drops off the roadmap.
            next=""
            while read -r t; do
              if [ "$t" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$t" | sort -V | head -1)" = "$VERSION" ]; then
                next="$t"; break
              fi
            done < <(awk '{ sub(/^[0-9]+ /, ""); print }' <<< "$open_list" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
            if [ -z "$next" ]; then
              IFS=. read -r major minor _ <<< "$VERSION"
              next="$major.$((minor + 1)).0"
            fi
            # The next minor may exist already, closed. Reopen it rather than fail on a duplicate.
            next_ms=$(milestones all | number_of "$next")
            if [ -z "$next_ms" ]; then
              next_ms=$(gh api -X POST "repos/$GITHUB_REPOSITORY/milestones" -f title="$next" --jq '.number')
            else
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$next_ms" -f state=open >/dev/null
            fi
            [[ "$next_ms" =~ ^[0-9]+$ ]] || { echo "::error::no milestone number for $next"; exit 1; }
            for n in $open; do
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -F milestone="$next_ms" >/dev/null
              echo "Moved #$n to $next."
            done
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$ms" -f state=closed >/dev/null
          echo "::notice::Closed milestone $VERSION."
