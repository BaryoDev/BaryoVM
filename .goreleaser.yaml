# GoReleaser — cross-platform binaries + checksums on each vX.Y.Z tag.
# Local dry run:  goreleaser release --snapshot --clean
version: 2

project_name: baryovm

before:
  hooks:
    - go mod tidy

builds:
  - id: baryovm
    main: ./cmd/baryovm
    binary: baryovm
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/BaryoDev/BaryoVM/internal/cli.Version={{ .Version }}

archives:
  - id: baryovm
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - USAGE.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
